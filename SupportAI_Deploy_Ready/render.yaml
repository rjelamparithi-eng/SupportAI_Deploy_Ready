services:
  - type: web
    name: support-ai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_NAME
        value: ai_support_saas
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: LLM_MODEL
        value: gpt-oss:120b
      - key: NOMIC_EMBED_MODEL
        value: nomic-embed-text-v1.5
      - key: MONGODB_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: NOMIC_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
